name: Run Telegram Bot

# GitHub Actions مش استضافة دايمة: أي job بيقف بعد 6 ساعات كحد أقصى.
# عشان كده البوت بيشتغل 5 ساعات و50 دقيقة وبعدها بيبدأ تشغيل جديد تلقائياً (كل 6 ساعات).
# بيانات المستخدمين بتتحفظ كنسخة احتياطية مثبّتة في شات الأدمن مع البوت وبتتستعاد مع كل تشغيل.
on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths: ["**.py", "requirements.txt", "*.xlsx", ".github/workflows/bot.yml"]
  workflow_dispatch:        # تشغيل يدوي من تبويب Actions

# تشغيل واحد بس في نفس الوقت (لو اتنين بيعملوا polling تيليجرام بيرجّع خطأ 409).
# أي push/تشغيل يدوي بيوقف النسخة القديمة ويشغّل الجديدة فوراً (عشان التعديلات تتطبّق).
# التشغيل المجدول بيستنى لحد ما اللي شغال يخلّص من غير ما يقطعه.
concurrency:
  group: feed-bot
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # اختياري: بيخلّي أرقام الإكسل تظهر في معاينة الموبايل (RECALC)
      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS || vars.ADMIN_IDS }}
          CHANNEL_USERNAME: "@KIRA349A"
        # 124 = وقت التشغيل خلص طبيعي (مش خطأ)
        run: timeout 350m python bot.py || [ $? -eq 124 ]
