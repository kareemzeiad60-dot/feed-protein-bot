name: Run Telegram Bot

# GitHub Actions مش استضافة دايمة: أي job بيقف بعد 6 ساعات كحد أقصى.
# عشان كده البوت بيشتغل 5 ساعات و50 دقيقة وبعدها بيبدأ تشغيل جديد تلقائياً (كل 6 ساعات).
# بيانات المستخدمين بتتحفظ كنسخة احتياطية مثبّتة في شات الأدمن مع البوت وبتتستعاد مع كل تشغيل.
on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths: ["**.py", "requirements.txt", "*.xlsx", ".github/workflows/bot.yml"]
  workflow_dispatch:        # تشغيل يدوي من تبويب Actions

# تشغيل واحد بس في نفس الوقت (لو اتنين بيعملوا polling تيليجرام بيرجّع خطأ 409).
# أي push/تشغيل يدوي بيوقف النسخة القديمة ويشغّل الجديدة فوراً (عشان التعديلات تتطبّق).
# التشغيل المجدول بيستنى لحد ما اللي شغال يخلّص من غير ما يقطعه.
concurrency:
  group: feed-bot
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      # ميزة التعرّف على السلالة بتشتغل بس لو secret باسم MODEL_REPO_TOKEN موجود (توكن بيقرا الريبو الخاص بتاع الموديل)
      HAS_MODEL: ${{ secrets.MODEL_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # الموديل في ريبو خاص (مش بنرفعه على الريبو العام): بنسحب منه الملفين المطلوبين بس وقت التشغيل
      # ميزة اختيارية: لو السحب فشل (مثلاً التوكن مالوش صلاحية) البوت بيكمّل شغل من غيرها بدل ما يقف
      - name: Fetch cattle breed model (private repo)
        id: model
        if: env.HAS_MODEL == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: kareemzeiad60-dot/111122
          token: ${{ secrets.MODEL_REPO_TOKEN }}
          path: _model_src
          sparse-checkout: artifacts/cattle-predict
          persist-credentials: false

      - name: Warn if the model could not be fetched
        if: env.HAS_MODEL == 'true' && steps.model.outcome == 'failure'
        run: echo "::warning::مقدرتش أسحب موديل السلالة من kareemzeiad60-dot/111122 — راجع صلاحيات MODEL_REPO_TOKEN. البوت شغال من غير الميزة دي."

      - name: Prepare cattle breed model
        if: env.HAS_MODEL == 'true' && steps.model.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p models
          cp _model_src/artifacts/cattle-predict/cattle_model.h5 _model_src/artifacts/cattle-predict/labels.json models/
          pip install -r requirements-cattle.txt

      # اختياري: بيخلّي أرقام الإكسل تظهر في معاينة الموبايل (RECALC)
      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS || vars.ADMIN_IDS }}
          CHANNEL_USERNAME: "@KIRA349A"
        # 124 = وقت التشغيل خلص طبيعي (مش خطأ)
        run: timeout 350m python bot.py || [ $? -eq 124 ]
